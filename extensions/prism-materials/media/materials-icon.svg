<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Nucleus -->
  <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none" opacity="0.7"/>
  <!-- Electron orbits -->
  <ellipse cx="12" cy="12" rx="10" ry="4.5"/>
  <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(60 12 12)"/>
  <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(120 12 12)"/>
  <!-- Electrons -->
  <circle cx="22" cy="12" r="1.3" fill="currentColor" stroke="none"/>
  <circle cx="7" cy="7.4" r="1.3" fill="currentColor" stroke="none"/>
  <circle cx="7" cy="16.6" r="1.3" fill="currentColor" stroke="none"/>
</svg>
