<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <radialGradient id="vignette" cx="55%" cy="48%" r="70%">
            <stop offset="60%" stop-color="#000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
        </radialGradient>

        <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
            <stop offset="50%" stop-color="#c8e6ff" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
        </linearGradient>

        <linearGradient id="internalGrad" x1="130" y1="246" x2="238" y2="246" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
        </linearGradient>

        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="strong-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <rect width="100%" height="100%" fill="transparent" />

    <!-- Incoming Light Beam -->
    <path d="M -20,246 L 130.4,246" stroke="#FFFFFF" stroke-width="2.5" filter="url(#strong-glow)" />

    <!-- The Prism -->
    <polygon points="180,160 90,316 270,316" fill="url(#glass)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Internal Dispersion Cone -->
    <polygon points="130.4,246 221.5,232 237.7,260" fill="url(#internalGrad)" style="mix-blend-mode: screen; opacity: 0.15;" />

    <!-- Spectral Beams -->
    <g stroke-width="3.5" filter="url(#glow)" style="mix-blend-mode: screen; stroke-linecap: butt;">
        <path stroke="#FF0000" d="M221.5,232 L520,127.5" />
        <path stroke="#FF8C00" d="M223.8,236 L520,162.5" />
        <path stroke="#FFD700" d="M226.2,240 L520,197.5" />
        <path stroke="#00FF00" d="M228.5,244 L520,232.5" />
        <path stroke="#00BFFF" d="M230.8,248 L520,267.5" />
        <path stroke="#0000FF" d="M233.1,252 L520,302.5" />
        <path stroke="#4B0082" d="M235.4,256 L520,337.5" />
        <path stroke="#8B00FF" d="M237.7,260 L520,372.5" />
    </g>

    <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />
</svg>
